<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>REDA TECH Store Management</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body id="root" class="flex flex-col min-h-screen">
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
