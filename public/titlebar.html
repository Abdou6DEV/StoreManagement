<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Title Bar</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #bar {
        box-sizing: border-box;
        height: 32px;
        display: flex;
        align-items: center;
        padding-left: 12px;
        padding-right: 0;
        background: #f0f0f1;
        color: #1c1c1e;
        -webkit-app-region: drag;
        app-region: drag;
        overflow: visible;
        position: relative;
      }
      /* Keep Windows overlay controls clickable (drag region must not cover them). */
      #wco-space {
        width: 140px;
        height: 100%;
        margin-left: auto;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      body.dark #bar {
        background: #0e0d0d;
        color: #f2f2f4;
      }
      #logo {
        display: block;
        width: 23px;
        height: 23px;
        object-fit: contain;
        pointer-events: none;
        flex-shrink: 0;
        position: relative;
        top: -3px;
      }
      #brand {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 100%;
        min-width: 0;
        flex-shrink: 1;
        pointer-events: none;
        font-family: system-ui, Segoe UI, sans-serif;
        font-size: 12px;
        opacity: 0.92;
      }
      #center {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: min(40vw, calc(100% - 280px));
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        pointer-events: none;
        white-space: nowrap;
        overflow: visible;
        font-family: system-ui, Segoe UI, sans-serif;
        font-size: 12px;
        opacity: 0.92;
      }
      #app-name {
        margin: 0;
        padding: 0;
        line-height: 20px;
        height: 20px;
        font-weight: 600;
        white-space: nowrap;
        overflow: visible;
      }
      #page-title {
        margin: 0;
        padding-top: 4px;
        padding-bottom: 4px;
        line-height: 1.4;
        font-weight: 500;
        opacity: 0.8;
        white-space: nowrap;
        overflow: visible;
      }
      body.is-hidden #bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bar" aria-hidden="true">
      <div id="brand" dir="ltr">
        <img id="logo" src="./myapp_black.ico" alt="" width="20" height="20" draggable="false" />
        <span id="app-name">Reda Tech POS</span>
      </div>
      <div id="center" dir="ltr">
        <span id="page-title"></span>
      </div>
      <div id="wco-space" aria-hidden="true"></div>
    </div>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.body.classList.toggle("dark", dark);
          var logoEl = document.getElementById("logo");
          if (logoEl) {
            logoEl.src = dark ? "./myapp.ico" : "./myapp_black.ico";
          }
        } catch (e) {}

        var logo = document.getElementById("logo");
        var brand = document.getElementById("brand");
        var center = document.getElementById("center");
        var appName = document.getElementById("app-name");
        var pageTitle = document.getElementById("page-title");

        function apply(data) {
          if (!data || typeof data !== "object") return;
          if (typeof data.theme === "string") {
            document.body.classList.toggle("dark", data.theme === "dark");
            if (logo) {
              logo.src =
                data.theme === "dark" ? "./myapp.ico" : "./myapp_black.ico";
            }
          }
          if (typeof data.appName === "string" && appName) {
            appName.textContent = data.appName;
          }
          if (typeof data.pageTitle === "string" && pageTitle) {
            pageTitle.textContent = data.pageTitle;
          }
          if (typeof data.dir === "string") {
            if (brand) brand.setAttribute("dir", data.dir);
            if (center) center.setAttribute("dir", data.dir);
          }
          if (typeof data.visible === "boolean") {
            document.body.classList.toggle("is-hidden", !data.visible);
          }
        }

        var api = window.api && window.api.app;
        if (api && typeof api.onTitleBarUpdate === "function") {
          api.onTitleBarUpdate(apply);
        }
      })();
    </script>
  </body>
</html>
