<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="View your REDA TECH store from your phone." />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>REDA TECH Mobile</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);

          // Keep the installed PWA system chrome black in both app themes.
          const themeColor = document.querySelector('meta[name="theme-color"]');
          themeColor?.setAttribute("content", "#000000");

          // Keep the launch-screen background matched to the saved theme.
          const manifest = document.querySelector('link[rel="manifest"]');
          manifest?.setAttribute(
            "href",
            isDark ? "manifest.webmanifest" : "manifest-light.webmanifest",
          );
        } catch {
          // The app theme provider applies the saved theme after startup if storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
