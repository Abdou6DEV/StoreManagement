<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reda Tech POS</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 h-8 overflow-hidden bg-transparent">
    <div id="root"></div>
    <script type="module" src="/src/titlebar/main.tsx"></script>
  </body>
</html>
